<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="character-container">
        <div class="character-list"></div>
        <div class="pagination-panel">
            <button data-event="changePage" data-direction="prev"
                class="pagination-button pagination-prev">Prev</button>
            <p class="pagination-page"></p>
            <button data-event="changePage" data-direction="next"
                class="pagination-button pagination-next">Next</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
